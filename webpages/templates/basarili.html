{% extends 'base.html' %}

{% block content %}
<style>
    /* APPLE GLOBAL RENKLER VE TİPOGRAFİ */
    :root {
        --apple-dark: #1d1d1f;
        --apple-light-bg: #f5f5f7;
        --apple-blue: #0071e3;
        --apple-blue-hover: #0077ed;
        --apple-green: #34c759; /* Apple Success Green */
        --apple-text-gray: #86868b;
    }

    body {
        background-color: var(--apple-light-bg);
    }

    /* KUSURSUZ MERKEZLENMİŞ BEYAZ KART */
    .apple-success-card {
        background: #ffffff;
        border-radius: 28px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
        padding: 60px 40px;
        max-width: 540px;
        margin: 0 auto;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.02);
        animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes slideUpFade {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* APPLE STİLİ ANİMASYONLU YEŞİL TİK (Checkmark) */
    .success-animation-container {
        display: flex;
        justify-content: center;
        margin-bottom: 25px;
    }

    .apple-checkmark-circle {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background-color: rgba(52, 199, 89, 0.1); /* Hafif yeşil arka plan */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .apple-checkmark-circle::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid var(--apple-green);
        opacity: 0;
        animation: pulseRing 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s forwards;
    }

    .apple-checkmark-icon {
        color: var(--apple-green);
        font-size: 40px;
        opacity: 0;
        transform: scale(0.5);
        animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
    }

    @keyframes popIn {
        to { opacity: 1; transform: scale(1); }
    }

    @keyframes pulseRing {
        0% { transform: scale(0.8); opacity: 0; }
        50% { opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
    }

    /* METİNLER */
    .apple-success-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--apple-dark);
        letter-spacing: -0.03em;
        margin-bottom: 12px;
    }

    .apple-success-desc {
        font-size: 1.05rem;
        color: var(--apple-text-gray);
        line-height: 1.5;
        margin-bottom: 40px;
    }

    /* BUTONLAR */
    .btn-apple-primary {
        background-color: var(--apple-blue);
        color: #fff !important;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 50px;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
        border: none;
        min-width: 160px;
    }
    .btn-apple-primary:hover {
        background-color: var(--apple-blue-hover);
        transform: scale(1.02);
    }

    .btn-apple-secondary {
        background-color: #f5f5f7;
        color: var(--apple-dark) !important;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 50px;
        text-decoration: none;
        display: inline-block;
        transition: 0.3s;
        border: none;
        min-width: 160px;
    }
    .btn-apple-secondary:hover {
        background-color: #e8e8ed;
    }

    @media (max-width: 576px) {
        .apple-success-card { padding: 40px 25px; margin: 0 15px; }
        .btn-apple-primary, .btn-apple-secondary { width: 100%; margin-bottom: 10px; }
    }
</style>

<div class="container py-5 d-flex align-items-center justify-content-center" style="min-height: 75vh;">
    <div class="apple-success-card w-100">
        
        <!-- APPLE STİLİ ANİMASYONLU TİK -->
        <div class="success-animation-container">
            <div class="apple-checkmark-circle">
                <i class="fas fa-check apple-checkmark-icon"></i>
            </div>
        </div>
        
        <h2 class="apple-success-title">Talebiniz Alındı</h2>
        <p class="apple-success-desc">
            İlgili firma ve müşteri temsilcimiz detaylar için en kısa sürede sizinle iletişime geçecektir. 
            Süreci profilinizden takip edebilirsiniz.
        </p>
        
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
            <a href="{% url 'home' %}" class="btn-apple-secondary">Ana Sayfa</a>
            {% if user.is_authenticated %}
                <a href="{% url 'profil' %}" class="btn-apple-primary">Taleplerimi Gör</a>
            {% endif %}
        </div>
        
    </div>
</div>
{% endblock %}
